<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Hub & Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #34d399;
      --accent-purple: #a78bfa;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--accent-blue);
      margin-bottom: 0.5rem;
    }

    /* Daily Quote Box */
    .quote-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent-purple);
      padding: 1.25rem;
      border-radius: 12px;
      margin-bottom: 2rem;
    }

    .quote-text {
      font-size: 1.05rem;
      font-style: italic;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .quote-author {
      font-size: 0.85rem;
      color: var(--subtext);
      text-align: right;
      font-weight: 600;
    }

    /* Trackers Section */
    .section-title {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      color: var(--text);
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .tracker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .tracker-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .tracker-card h3 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--accent-blue);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--subtext);
    }

    input[type="number"] {
      background-color: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    .percentage-display {
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      color: var(--accent-green);
      margin-top: 0.5rem;
    }

    .progress-bar-bg {
      background-color: #0f172a;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--accent-green);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Weekly Planner Section */
    .planner-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }

    .day-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }

    .day-title {
      font-weight: bold;
      color: var(--accent-blue);
      margin-bottom: 0.75rem;
      font-size: 1.05rem;
    }

    .task-input-container {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .task-input-container input {
      flex: 1;
      background-color: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .task-input-container button {
      background-color: var(--accent-blue);
      color: #0f172a;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .task-list {
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px solid #334155;
      font-size: 0.9rem;
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: var(--subtext);
    }

    .task-item button {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: 0.5rem;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      color: var(--subtext);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Study Hub</h1>
      <p style="color: var(--subtext);">Organize your academic performance and weekly goals</p>
    </header>

    <!-- Daily Quote -->
    <div class="quote-card">
      <div class="quote-text" id="quoteText">"Loading daily motivation..."</div>
      <div class="quote-author" id="quoteAuthor"></div>
    </div>

    <!-- Trackers -->
    <h2 class="section-title">Academic Overview & Trackers</h2>
    <div class="tracker-grid">
      
      <!-- Attendance Tracker -->
      <div class="tracker-card">
        <h3>School Attendance</h3>
        <div class="input-group">
          <label>Days Attended</label>
          <input type="number" id="attAttended" min="0" placeholder="0" />
          <label>Total School Days</label>
          <input type="number" id="attTotal" min="0" placeholder="0" />
        </div>
        <div class="percentage-display" id="attPercentage">0%</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="attBar"></div></div>
      </div>

      <!-- Grades Tracker -->
      <div class="tracker-card">
        <h3>Grades Average</h3>
        <div class="input-group">
          <label>Total Points Earned</label>
          <input type="number" id="gradeEarned" min="0" placeholder="0" />
          <label>Total Max Points</label>
          <input type="number" id="gradeTotal" min="0" placeholder="0" />
        </div>
        <div class="percentage-display" id="gradePercentage">0%</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="gradeBar"></div></div>
      </div>

      <!-- Homework Tracker -->
      <div class="tracker-card">
        <h3>Homework Completion</h3>
        <div class="input-group">
          <label>Homework Completed</label>
          <input type="number" id="hwCompleted" min="0" placeholder="0" />
          <label>Total Homework Assigned</label>
          <input type="number" id="hwTotal" min="0" placeholder="0" />
        </div>
        <div class="percentage-display" id="hwPercentage">0%</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="hwBar"></div></div>
      </div>

    </div>

    <!-- Weekly Planner -->
    <h2 class="section-title">Weekly Schedule & Tasks</h2>
    <div class="planner-grid" id="plannerGrid"></div>

    <footer>
      <p>&copy; Study Hub • Data saved locally in your browser</p>
    </footer>
  </div>

  <script>
    // --- 1. DAILY QUOTES ---
    const quotesList = [
      { quote: "Success is the sum of small efforts, repeated day in and day out.", author: "Robert Collier" },
      { quote: "The secret of getting ahead is getting started.", author: "Mark Twain" },
      { quote: "It always seems impossible until it's done.", author: "Nelson Mandela" },
      { quote: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson" },
      { quote: "Small daily improvements over time lead to stunning results.", author: "Robin Sharma" },
      { quote: "Focus on being productive instead of busy.", author: "Tim Ferriss" },
      { quote: "Action is the foundational key to all success.", author: "Pablo Picasso" }
    ];

    function setDailyQuote() {
      const today = new Date();
      const startOfYear = new Date(today.getFullYear(), 0, 0);
      const diff = today - startOfYear;
      const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
      const selected = quotesList[dayOfYear % quotesList.length];

      document.getElementById('quoteText').textContent = `"${selected.quote}"`;
      document.getElementById('quoteAuthor').textContent = `— ${selected.author}`;
    }

    // --- 2. CALCULATORS & STORAGE ---
    const fields = ['attAttended', 'attTotal', 'gradeEarned', 'gradeTotal', 'hwCompleted', 'hwTotal'];

    function calculatePercentages() {
      // Attendance
      calcItem('attAttended', 'attTotal', 'attPercentage', 'attBar');
      // Grades
      calcItem('gradeEarned', 'gradeTotal', 'gradePercentage', 'gradeBar');
      // Homework
      calcItem('hwCompleted', 'hwTotal', 'hwPercentage', 'hwBar');

      saveData();
    }

    function calcItem(valId, totalId, displayId, barId) {
      const val = parseFloat(document.getElementById(valId).value) || 0;
      const total = parseFloat(document.getElementById(totalId).value) || 0;
      let pct = 0;

      if (total > 0) {
        pct = Math.min(Math.round((val / total) * 100), 100);
      }

      document.getElementById(displayId).textContent = `${pct}%`;
      document.getElementById(barId).style.width = `${pct}%`;
    }

    function saveData() {
      const data = {};
      fields.forEach(id => {
        data[id] = document.getElementById(id).value;
      });
      localStorage.setItem('studyHubMetrics', JSON.stringify(data));
    }

    function loadData() {
      const saved = localStorage.getItem('studyHubMetrics');
      if (saved) {
        const data = JSON.parse(saved);
        fields.forEach(id => {
          if (data[id] !== undefined) {
            document.getElementById(id).value = data[id];
          }
        });
      }
      calculatePercentages();
    }

    fields.forEach(id => {
      document.getElementById(id).addEventListener('input', calculatePercentages);
    });

    // --- 3. WEEKLY PLANNER ---
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    let weeklyTasks = JSON.parse(localStorage.getItem('studyHubPlanner')) || {
      Monday: [], Tuesday: [], Wednesday: [], Thursday: [], Friday: [], Saturday: [], Sunday: []
    };

    function renderPlanner() {
      const grid = document.getElementById('plannerGrid');
      grid.innerHTML = '';

      days.forEach(day => {
        const dayCard = document.createElement('div');
        dayCard.className = 'day-card';

        const title = document.createElement('div');
        title.className = 'day-title';
        title.textContent = day;

        const inputContainer = document.createElement('div');
        inputContainer.className = 'task-input-container';

        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Add task...';

        const addBtn = document.createElement('button');
        addBtn.textContent = '+';
        addBtn.onclick = () => {
          if (input.value.trim() !== '') {
            weeklyTasks[day].push({ text: input.value.trim(), done: false });
            savePlanner();
            renderPlanner();
          }
        };

        inputContainer.appendChild(input);
        inputContainer.appendChild(addBtn);

        const list = document.createElement('ul');
        list.className = 'task-list';

        (weeklyTasks[day] || []).forEach((task, index) => {
          const li = document.createElement('li');
          li.className = `task-item ${task.done ? 'completed' : ''}`;

          const taskSpan = document.createElement('span');
          taskSpan.textContent = task.text;
          taskSpan.style.cursor = 'pointer';
          taskSpan.onclick = () => {
            weeklyTasks[day][index].done = !weeklyTasks[day][index].done;
            savePlanner();
            renderPlanner();
          };

          const delBtn = document.createElement('button');
          delBtn.textContent = '✕';
          delBtn.onclick = () => {
            weeklyTasks[day].splice(index, 1);
            savePlanner();
            renderPlanner();
          };

          li.appendChild(taskSpan);
          li.appendChild(delBtn);
          list.appendChild(li);
        });

        dayCard.appendChild(title);
        dayCard.appendChild(inputContainer);
        dayCard.appendChild(list);
        grid.appendChild(dayCard);
      });
    }

    function savePlanner() {
      localStorage.setItem('studyHubPlanner', JSON.stringify(weeklyTasks));
    }

    // Initialize Page
    setDailyQuote();
    loadData();
    renderPlanner();
  </script>
</body>
</html>
